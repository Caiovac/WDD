<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    mode="over"
    [opened]="false"
    autoFocus="false"
  >
    <div class="sidebar-logo">
      <img src="/btct.png" alt="Logo" />
    </div>

    <mat-nav-list>
      <a mat-list-item *ngFor="let item of menuItems"
         [routerLink]="item.link"
         routerLinkActive="active"
         (click)="drawer.close()">
        {{ item.label }}
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <button
      mat-icon-button
      class="floating-hamburger always"
      (click)="drawer.toggle()"
      aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
