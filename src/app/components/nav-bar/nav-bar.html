<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    mode="over"
    [opened]="false"
    autoFocus="false"
  >
    <div class="sidebar-logo">
      <img src="/assets/btct.png" alt="Logo" />
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let item of menuItems"
        [routerLink]="item.link"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        {{ item.label | t }}
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content" #content>
    <!-- hamburger -->
    <button
      mat-icon-button
      class="floating-hamburger always"
      (click)="drawer.toggle()"
      aria-label="Menu"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <!-- 👇 language switch -->
    <div class="lang-switch">
      <button
        mat-stroked-button
        class="lang-btn"
        [matMenuTriggerFor]="langMenu"
        aria-label="Change language"
      >
        <span class="flag" aria-hidden="true">{{ flagFor(currentLang) }}</span>
        <mat-icon class="chev" aria-hidden="true">keyboard_arrow_down</mat-icon>
      </button>

      <!-- pannello menu con stile custom -->
      <mat-menu #langMenu="matMenu" [overlapTrigger]="false" panelClass="lang-menu-panel">
        <button mat-menu-item (click)="setLang('it')" [class.active]="currentLang==='it'">
          <span class="flag">🇮🇹 </span> <span>{{ 'lang.IT' | t }}</span>
        </button>
        <button mat-menu-item (click)="setLang('pt')" [class.active]="currentLang==='pt'">
          <span class="flag">🇵🇹 </span> <span>{{ 'lang.PT' | t }}</span>
        </button>
        <button mat-menu-item (click)="setLang('es')" [class.active]="currentLang==='es'">
          <span class="flag">🇪🇸 </span> <span>{{ 'lang.ES' | t }}</span>
        </button>
        <button mat-menu-item (click)="setLang('en')" [class.active]="currentLang==='en'">
          <span class="flag">🇬🇧 </span> <span>{{ 'lang.EN' | t }}</span>
        </button>
      </mat-menu>
    </div>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
