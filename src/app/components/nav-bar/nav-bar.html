<mat-sidenav-container class="app-sidenav-container">

  <!-- MENU LATERALE -->
    <mat-sidenav
    #drawer
    class="app-sidenav"
    [mode]="isHandset ? 'over' : 'side'"
    [(opened)]="opened"
    (closedStart)="opened = false"
  >
    <!-- LOGO SOPRA -->
    <div class="sidebar-logo">
      <img src="/btct.png" alt="Logo" />
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let item of menuItems"
        [routerLink]="item.link"
        routerLinkActive="active"
        (click)="isHandset ? drawer.close() : null"
      >
        {{ item.label }}
      </a>
    </mat-nav-list>
  </mat-sidenav>


  <!-- CONTENUTO PRINCIPALE -->
  <mat-sidenav-content class="app-content">

    <!-- HAMBURGER FLOTTANTE SOLO SU MOBILE -->
    <button
      *ngIf="isHandset"
      mat-icon-button
      class="floating-hamburger"
      (click)="drawer.toggle()"
      aria-label="Menu"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
