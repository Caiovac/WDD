<div class="loader-overlay" [class.active]="active" role="status" aria-live="polite" [attr.aria-busy]="active">
  <div class="hearts">
    <span class="heart" style="--x:-72px; --d:0ms;"></span>
    <span class="heart" style="--x:-24px; --d:200ms;"></span>
    <span class="heart" style="--x: 24px; --d:400ms;"></span>
    <span class="heart" style="--x: 64px; --d:600ms;"></span>
    <span class="heart" style="--x:110px; --d:800ms;"></span>
  </div>
  <div class="loader-text">Caricamento…</div>
</div>
