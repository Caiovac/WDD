<section class="story-hero" id="top">
  <div class="story-container">
    <p class="story-kicker">{{ 'ourStory.hero.kicker' | t }}</p>
    <h1 class="story-title">{{ 'ourStory.hero.title' | t }}</h1>
    <p class="story-lead">{{ 'ourStory.hero.lead' | t }}</p>
  </div>
</section>

<figure class="story-photo">
  <img src="/assets/Prayer.png"
       [alt]="'ourStory.collage.altHero' | t"
       loading="lazy" decoding="async"/>
</figure>

<section class="story-hero">
  <div class="story-container">
    <p class="story-kicker">{{ 'ourStory.place.kicker' | t }}</p>
    <h2 class="story-title">{{ 'ourStory.place.title' | t }}</h2>
    <p class="story-lead">{{ 'ourStory.place.lead' | t }}</p>
  </div>
</section>

<section class="story-collage">
  <div class="collage-grid">
    <figure class="collage-item ph-a">
      <img src="/assets/tatiana.jpeg"
           [alt]="'ourStory.collage.altA' | t"
           loading="lazy" decoding="async">
    </figure>

    <figure class="collage-item ph-b">
      <img src="/assets/churchGuys.jpeg"
           [alt]="'ourStory.collage.altB' | t"
           loading="lazy" decoding="async">
    </figure>

    <figure class="collage-item ph-c">
      <img src="/assets/caio.jpeg"
           [alt]="'ourStory.collage.altC' | t"
           loading="lazy" decoding="async">
    </figure>
  </div>
  <figcaption class="collage-caption">
    {{ 'ourStory.collage.caption' | t }}
  </figcaption>
</section>

<div class="story-footer">
  <button
    class="backtotop"
    [class.visible]="showBackTop"
    (click)="scrollTop()"
    [attr.aria-label]="'ourStory.backTop.aria' | t"
    [attr.title]="'ourStory.backTop.aria' | t">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 8l-6 6h4v6h4v-6h4z" fill="currentColor"/>
    </svg>
  </button>
  <span class="back-top-label" (click)="scrollTop()">
    {{ 'ourStory.backTop.label' | t }}
  </span>
</div>
